bio: |
  Melike Eğer Aydoğmuş completed her undergraduate degree in Psychology at Boğaziçi University in 2006. She earned an MA in General Psychology from Boston University in 2010, followed by a second MA and a PhD in Social Psychology from the University of Alabama in 2015. Since 2015, she has been a faculty member in the Psychology Department at Hacettepe University, where she received her Associate Professor degree in Social Psychology in 2023. Additionally, she has served as an adjunct faculty member in the Faculty of Nursing and Health Innovations at Arizona State University since 2021.
Her research interests include stigma and ageism, perfectionism, self-compassion, self-determination theory, psychology education, medically unexplained symptoms, and emotion processing..

