bio: |
Dr. Melike Eğer Aydoğmuş is an Associate Professor of Social Psychology at Hacettepe University. Her research on self-compassion, perfectionism, and stigma has been published in leading peer-reviewed journals, utilizing advanced quantitative methodologies. Melike is passionate about bridging cultural and universal approaches to deepen our understanding of psychological well-being and societal attitudes.

